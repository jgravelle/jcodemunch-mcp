[project]
name = "jcodemunch-mcp"
version = "1.108.316"
description = "Token-efficient MCP server for source code exploration via tree-sitter AST parsing"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "J. Gravelle", email = "j@gravelle.us" },
]
license = "LicenseRef-jCodeMunch-Dual-Use-1"
license-files = ["LICENSE"]
keywords = [
    "mcp",
    "model-context-protocol",
    "code-search",
    "code-intelligence",
    "tree-sitter",
    "ast",
    "llm",
    "agent",
    "token-efficiency",
    "claude",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.10.0,<2.0.0",
    "httpx>=0.27.0",
    # Ceiling is deliberate, re-verified against 1.13.3 on 2026-07-26 (#382).
    # 1.x stopped bundling grammars: the wheel ships one native module and
    # get_parser DOWNLOADS the grammar into a user-level cache on first use
    # (verified: empty cache -> 67 shared libs while walking our language list).
    # That is undisclosed runtime network + executable-write behavior in a
    # read-only local tool, and it breaks airgapped/offline installs.
    # Also: autohotkey/ejs/verse do not exist in 1.x at all, and the nim grammar
    # was swapped for a different upstream (source_file/proc_declaration ->
    # module/stmt/routine), so our nim extractor yields zero symbols.
    # Suite on 1.13.3: 5812 passed, 12 skipped, 1 failed (test_nim_parsing).
    # We use exactly one symbol from this package (get_parser) -- the blockers
    # are behavioral, not API. Revisit only with grammars vendored or the
    # download made opt-in AND README-disclosed.
    "tree-sitter-language-pack>=0.7.0,<1.0.0",
    "pathspec>=0.12.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/jgravelle/jcodemunch-mcp"
Repository = "https://github.com/jgravelle/jcodemunch-mcp"
"Bug Tracker" = "https://github.com/jgravelle/jcodemunch-mcp/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
gemini = ["google-generativeai>=0.8.0"]
openai = ["openai>=1.0.0"]
minimax = ["openai>=1.0.0"]
zhipu = ["openai>=1.0.0"]
dbt = ["pyyaml>=6.0"]
http = ["uvicorn>=0.20.0", "starlette>=1.3.1", "anyio>=4.0.0"]
watch = ["watchfiles>=1.0.0"]
semantic = ["sentence-transformers>=2.2.0"]
local-embed = ["onnxruntime>=1.16.0"]
groq = ["openai>=1.0.0"]
groq-voice = ["openai>=1.0.0", "sounddevice>=0.4.6", "numpy>=1.24.0"]
groq-explain = ["openai>=1.0.0", "Pillow>=10.0.0"]
keyring = ["keyring>=24.0"]
bench = ["openai>=1.0.0", "anthropic>=0.40.0", "pyyaml>=6.0", "rich>=13.0", "jinja2>=3.1"]
# `all` is a hand-maintained union of every extra above. When you add a new
# extra or a new dependency to one, mirror it here (there is no auto-union).
all = ["anthropic>=0.40.0", "google-generativeai>=0.8.0", "openai>=1.0.0", "pyyaml>=6.0", "uvicorn>=0.20.0", "starlette>=1.3.1", "anyio>=4.0.0", "watchfiles>=1.0.0", "sentence-transformers>=2.2.0", "onnxruntime>=1.16.0", "sounddevice>=0.4.6", "numpy>=1.24.0", "Pillow>=10.0.0", "rich>=13.0", "jinja2>=3.1", "keyring>=24.0"]


[project.scripts]
jcodemunch-mcp = "jcodemunch_mcp.server:main"
gcm = "jcodemunch_mcp.groq.cli:main"
munch-bench = "munch_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Two top-level packages is DELIBERATE, reaffirmed 2026-08-05. munch_bench
# backs the `munch-bench` console script below; dropping it from this list
# would remove a working command from every installed user. An artifact scan
# reports it as a second top-level name -- that is expected, not a finding.
packages = ["src/jcodemunch_mcp", "munch-bench/munch_bench"]

[tool.hatch.build.targets.sdist]
# Build artifacts of the VS Code extension. The extension SOURCE stays (it is
# tracked and small); these three are generated and never rebuildable-from
# inputs a Python sdist consumer needs. node_modules alone was 128 entries.
# Nested .gitignore files do not reach hatchling, only the root one does.
exclude = [
    ".claude/",
    # Per-project index config for THIS source tree: it raises `max_file_size`
    # so `server.py` and `parser/extractor.py` enter this repo's own index
    # (#566). A consumer who installs the package does not have this tree, so
    # the key describes nothing on their machine. Tracked because it is a real
    # repo setting; excluded because "tracked" and "shipped" are different.
    ".jcodemunch.jsonc",
    # Git-only: pins tests/fixtures/racket/*.rkt to LF for the frozen byte-position
    # oracle. A checkout concern, not a distribution one.
    ".gitattributes",
    "index.php",
    "vscode-extension/node_modules/",
    "vscode-extension/out/",
    "*.vsix",
    # Dev-box maintenance for the whole jMunch suite: it hard-codes
    # `C:\Program Files\Python310` and the `C:\MCPs\*` trees, so it is noise
    # to a PyPI consumer and cannot work on their machine. Tracked because it
    # encodes a real lesson (uninstalling an MCP package while its server runs
    # half-removes it); excluded because "tracked" and "shipped" are different
    # questions. `scripts/unstable_modules_diag.py` DOES ship -- it diagnoses a
    # metric a user can see on their own repo.
    "scripts/repair-munch-installs.ps1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# ⚠⚠ EXPLICIT `select`, added 2026-08-07. These four are pycodestyle E4/E7/E9 +
# pyflakes F -- the same set ruff applies by default TODAY, written down so it
# stays the set tomorrow.
#
# Ruff's default selection is NOT stable across versions. This repo happened to
# be insulated because it tracks `uv.lock`, which pins ruff; the exposure is one
# `uv lock` away. Measured in jdatamunch-mcp, which gitignores its lock and so
# resolves ruff freely: an `ignore`-only config under ruff 0.16.2 produced 446
# findings (YTT/ASYNC/S/BLE/B/UP/I) where the intended set gives 10. That would
# have arrived here as a re-lock, not as a config change anyone reviewed.
#
# Pin the tool where you can; pin the RULES regardless. Widening the set is now
# a deliberate decision rather than a side effect of an upgrade.
select = ["E4", "E7", "E9", "F"]
# We keep the high-signal correctness rules (unused imports, undefined names,
# duplicate keys, f-string/format bugs, redefinitions, comparison/syntax errors) and
# ignore the codes that reflect deliberate, pervasive patterns in this
# codebase rather than real defects.
ignore = [
    "E402",  # module-import-not-at-top: deliberate lazy/local imports (startup speed, pytest.importorskip)
    "E701",  # multiple-statements-on-one-line: a few terse one-line guards
    "E721",  # type-comparison: a handful of intentional type(x) == Y checks
    "E731",  # lambda-assignment: stylistic
    "E741",  # ambiguous variable name (l/I/O): pre-existing, low risk
    # F841 (local assigned but never used): ~31 pre-existing dead locals. Safe
    # removal needs per-case RHS side-effect review, so it is a tracked ratchet
    # follow-up rather than a gate blocker. Re-enable once cleaned.
    "F841",
]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports are the package's public API surface, not dead imports.
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    # Parallel test execution. Measured 2026-08-16 on a 24-core box: the serial
    # suite is 599s, `-n auto --dist loadfile` is 183s, both collecting 7859.
    #
    # ⚠⚠ `--dist loadfile` is REQUIRED, not a tuning choice. It keeps a whole
    # file on one worker, preserving within-file order. The default `--dist load`
    # spreads individual tests and would break any file whose tests share
    # module-level state.
    #
    # ⚠ Worker isolation is STRONGER than the serial run, not weaker: everything
    # conftest resets per test (`_GLOBAL_CONFIG`, the index cache, perf-DB
    # handles) is process-global, and each xdist worker is its own process. What
    # parallelism removes is the accidental cross-FILE ordering the serial run
    # provides for free -- which is how it surfaced the test_css/test_json
    # config-twin defect that had been latent on any box with a `languages`
    # allowlist.
    "pytest-xdist>=3.6.0",
    "hypothesis>=6.0.0",
    "ruff>=0.6.0",
    # Not a package dependency: the benchmark harnesses in benchmarks/ import it.
    # Here so tests/test_benchmark_reference.py's loader tests RUN in CI instead
    # of importorskip-ing. The harness is edited by people who are not running
    # it, which is exactly how its jCodeMunch constants went four months stale.
    "tiktoken>=0.7.0",
]
