version: 2
# One entry per ecosystem and directory: GitHub rejects the file when two
# entries share 'package-ecosystem', 'directory' and 'target-branch'. Each entry
# therefore carries both postures:
#   - Security updates: opened when a vulnerability alert fires, not on the
#     schedule, and collapsed by an `applies-to: security-updates` group into
#     one combined PR. `open-pull-requests-limit` does not cap them.
#   - Version updates: monthly, minor and patch only, one PR (limit 1). Majors
#     stay manual. Every PR runs the full PR gate (docs/cicd/DESIGN.md
#     section 4), which is the point of letting them in.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      python-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions are SHA-pinned in .github/workflows/*.yml; Dependabot bumps
  # the pins (monthly, one PR, majors included as before) and covers them with vulnerability alerts.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      actions:
        applies-to: version-updates
        patterns:
          - "*"

  # vscode-extension/ (npm): the same two postures as uv above. Its PRs run
  # vscode-extension.yml, which builds and packages the extension.
  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
