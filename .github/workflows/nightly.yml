# Nightly drift run (docs/cicd/DESIGN.md section 4; CLAUDE.md "The Standard and the Harness").
#
# Purpose:  catch drift that arrives without a commit -- a runner image, a
#           dependency's new release, an upstream tree-sitter grammar, a new
#           advisory -- by running the PR gate's judgment on main every night
#           across the whole matrix, with the benchmark corpora cloned FRESH
#           (no cache, so a moved pin cannot hide behind one).
# Trigger:  04:00Z daily, or dispatch.
# Blocks:   nothing; it OPENS ISSUES labeled `drift`, one per failing
#           threshold, deduplicated by title.
# Rules:    thresholds never live here; actions SHA-pinned; no continue-on-error.
name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  UV_VERSION: "0.9.5"

jobs:
  fast:
    name: "nightly: fast tier + network Floors"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --extra watch
      - name: Fast tier
        run: uv run python -m harness fast --summary "${RUNNER_TEMP}/summary.md" --annotate
      - name: Dependency audit (a new advisory arrives without a commit)
        if: always()
        run: uv run --no-dev python -m harness check deps.vuln_max --summary "${RUNNER_TEMP}/summary.md" --annotate
      - name: Types ratchet
        if: always()
        run: uv run python -m harness check types.error_max --summary "${RUNNER_TEMP}/summary.md" --annotate
      - if: always()
        run: cat "${RUNNER_TEMP}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open a drift issue per failing Floor
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/open_regression_issue.py --summary "${RUNNER_TEMP}/summary.md" --label drift --title-prefix drift --range "${{ github.sha }}"

  full:
    name: "nightly: full tier (${{ matrix.os }}, ${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --group dev --extra watch --python ${{ matrix.python-version }}
      - name: Full tier
        shell: bash
        run: uv run --python ${{ matrix.python-version }} python -m harness full --summary "${RUNNER_TEMP}/summary.md" --annotate
      - if: always()
        shell: bash
        run: cat "${RUNNER_TEMP}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open a drift issue per failing Floor
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --python ${{ matrix.python-version }} python scripts/open_regression_issue.py --summary "${RUNNER_TEMP}/summary.md" --label drift --title-prefix "drift (${{ matrix.os }}, ${{ matrix.python-version }})" --range "${{ github.sha }}"

  bench:
    name: "nightly: bench tier online, fresh corpora"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --extra watch
      - name: Clone the pinned corpora FRESH (no cache by design; LF)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bench-corpus"
          uv run python - > "${RUNNER_TEMP}/pins.txt" <<'PY'
          import json, pathlib
          for r in json.loads(pathlib.Path("benchmarks/tasks.json").read_text(encoding="utf-8"))["repos"]:
              print(r["id"], r["sha"])
          PY
          while read -r repo sha; do
            dir="${RUNNER_TEMP}/bench-corpus/${repo//\//__}"
            git -c core.autocrlf=false clone --quiet --filter=blob:none --no-checkout "https://github.com/${repo}.git" "$dir"
            git -C "$dir" checkout --quiet "$sha"
            echo "${repo} @ $(git -C "$dir" rev-parse HEAD)"
          done < "${RUNNER_TEMP}/pins.txt"
      - name: Index the corpora
        env:
          CODE_INDEX_PATH: ${{ runner.temp }}/bench-index
        shell: bash
        run: |
          set -euo pipefail
          for dir in "${RUNNER_TEMP}"/bench-corpus/*/; do
            uv run python -c "
          import sys
          from jcodemunch_mcp import config; config.load_config()
          from jcodemunch_mcp.tools.index_folder import index_folder
          r = index_folder(sys.argv[1], use_ai_summaries=False, incremental=False, identity_mode='git')
          print(sys.argv[1], '->', r.get('repo'), r.get('file_count'), r.get('error') or '')
          " "$dir"
          done
      - name: Bench tier, online
        env:
          CODE_INDEX_PATH: ${{ runner.temp }}/bench-index
        run: uv run python -m harness bench --write-results --summary "${RUNNER_TEMP}/summary.md" --annotate
      - if: always()
        run: cat "${RUNNER_TEMP}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: harness-nightly-${{ github.run_id }}
          path: |
            harness/results/latest.json
            harness/results/self_latency.json
            harness/results/self_latency.failed.json
          retention-days: 90
      - name: Open a drift issue per failing Floor
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/open_regression_issue.py --summary "${RUNNER_TEMP}/summary.md" --label drift --title-prefix drift --range "${{ github.sha }}"
