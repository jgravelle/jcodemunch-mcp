# purpose:  the full-corpus benchmark for a grammar or parser bump, the one
#           job the policy exempts from the runtime ceiling (POLICY section
#           2; DESIGN section 4): two fresh runs, main and the PR's merge
#           ref, one table per Floor row. Two jobs: bench (no model, no App
#           token, read-only; it EXECUTES the merge ref's build hooks and
#           harness, so nothing that can write is minted in its process)
#           and apply (no model; the App token; the table and the label)
# invokes:  killswitch.py, budget.py, `uv run python -m harness bench` on
#           both trees, bench_table.py, apply_depeval.py --append-table,
#           ledger.py
# produces: the per-row table appended under the sticky comment;
#           agent:bench-pending swapped for agent:needs-human-review
# refuses:  to apply agent:ready-to-merge; to check out the PR head at the
#           workspace root; to run on anything but a same-repo Dependabot
#           PR that the depeval apply job (the App) just labelled
#           agent:bench-pending
name: inbound full-corpus bench

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: inbound-bench-full
  cancel-in-progress: false

env:
  # A runner is not a user: its tool calls must not be reported to the public savings total (cicd C-23).
  JCODEMUNCH_SHARE_SAVINGS: "0"

jobs:
  gate:
    # No model and no PR code: the switch is read with the App token (the only
    # token that can read a repository variable, VERIFICATION 7.1) and the budget
    # with GITHUB_TOKEN; the next job holds neither the App token nor a read of
    # its own and starts only from this job's `go`.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.label.name == 'agent:bench-pending' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: switch-reading token (App; the only token that can read a repository variable, VERIFICATION 7.1)
        id: switchtok
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.INBOUND_APP_ID }}
          private-key: ${{ secrets.INBOUND_APP_PRIVATE_KEY }}
      - name: kill switch and budget
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWITCH_TOKEN: ${{ steps.switchtok.outputs.token }}
        run: |
          set +e
          GH_TOKEN="$SWITCH_TOKEN" python .github/inbound/killswitch.py --repo "$REPO" --job inbound-bench-full --item "$PR" --record "$RUNNER_TEMP/audit/record.json"; k=$?
          python .github/inbound/budget.py --job inbound-bench-full --repo "$REPO"; b=$?
          set -e
          if [ "$k" != "0" ] || [ "$b" != "0" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: inbound-audit-${{ github.run_id }}-gate
          path: ${{ runner.temp }}/audit/
          retention-days: 90
          if-no-files-found: ignore

  bench:
    needs: gate
    # The label is applied by the App from inbound-depeval's apply job, so
    # the actor of this event is the App; a human applying the same label
    # is the manual re-run path. Same-repo guard: DESIGN section 9.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.label.name == 'agent:bench-pending' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/') &&
      needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
      ok: ${{ steps.pr.outputs.ok }}
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: gate (read by the `gate` job with the App token; this job holds no App token)
        id: gate
        run: echo "go=true" >> "$GITHUB_OUTPUT"

      - name: the PR must be Dependabot's and still carry the label
        if: steps.gate.outputs.go == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view "$PR" -R "$REPO" --json author,headRefName,labels,headRefOid \
            --jq '{author: .author.login, head: .headRefName, labels: [.labels[].name], sha: .headRefOid}' > "$RUNNER_TEMP/pr.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          p = json.load(open(os.environ["RUNNER_TEMP"] + "/pr.json", encoding="utf-8"))
          ok = (p["author"] in ("dependabot", "app/dependabot", "dependabot[bot]")
                and p["head"].startswith("dependabot/")
                and "dependencies" in p["labels"] and "agent:bench-pending" in p["labels"])
          print("ok=" + str(ok).lower())
          PY

      - name: main, every pinned corpus (not --offline)
        if: steps.gate.outputs.go == 'true' && steps.pr.outputs.ok == 'true'
        run: |
          uv sync --locked --group dev --extra watch
          uv run python -m harness warm
          mkdir -p "$RUNNER_TEMP/out"
          uv run python -m harness bench --summary "$RUNNER_TEMP/out/bench_main.md" || true
          cp harness/results/latest.json "$RUNNER_TEMP/out/latest_main.json" 2>/dev/null || true
          git checkout -q -- harness/results 2>/dev/null || true

      - name: the PR's merge ref, in a worktree under the runner temp (never the workspace root)
        if: steps.gate.outputs.go == 'true' && steps.pr.outputs.ok == 'true'
        run: |
          git fetch -q origin "refs/pull/$PR/merge:refs/inbound/pr-merge"
          git worktree add -q "$RUNNER_TEMP/pr-tree" refs/inbound/pr-merge
          cd "$RUNNER_TEMP/pr-tree"
          uv sync --locked --group dev --extra watch
          uv run python -m harness warm
          uv run python -m harness bench --summary "$RUNNER_TEMP/out/bench_pr.md" || true
          cp harness/results/latest.json "$RUNNER_TEMP/out/latest_pr.json" 2>/dev/null || true

      - name: one table, per row (F-13, never per total)
        if: steps.gate.outputs.go == 'true' && steps.pr.outputs.ok == 'true'
        run: |
          uv run python .github/inbound/bench_table.py --base "$RUNNER_TEMP/out/latest_main.json" --head "$RUNNER_TEMP/out/latest_pr.json" \
            --base-summary "$RUNNER_TEMP/out/bench_main.md" --head-summary "$RUNNER_TEMP/out/bench_pr.md" > "$RUNNER_TEMP/out/table.md"
          cat "$RUNNER_TEMP/out/table.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always() && steps.gate.outputs.go == 'true' && steps.pr.outputs.ok == 'true'
        with:
          name: inbound-bench-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 90
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: inbound-audit-${{ github.run_id }}-bench
          path: ${{ runner.temp }}/audit/
          retention-days: 90
          if-no-files-found: ignore

  apply:
    # The write job: no model; nothing from the PR is executed here; the
    # App token for the appended table and the label swap.
    needs: bench
    if: always() && needs.bench.outputs.go == 'true' && needs.bench.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v5
        with:
          name: inbound-bench-${{ github.run_id }}
          path: ${{ runner.temp }}/out/

      - name: switch-reading token (App; the only token that can read a repository variable, VERIFICATION 7.1)
        id: switchtok
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.INBOUND_APP_ID }}
          private-key: ${{ secrets.INBOUND_APP_PRIVATE_KEY }}
      - name: "re-read the kill switch before the write (the App token; the only token that can read a variable)"
        env:
          SWITCH_TOKEN: ${{ steps.switchtok.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: GH_TOKEN="$SWITCH_TOKEN" python .github/inbound/killswitch.py --repo "$REPO"

      - name: App token (DESIGN D2; this job only)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.INBOUND_APP_ID }}
          private-key: ${{ secrets.INBOUND_APP_PRIVATE_KEY }}

      - name: append under the sticky comment; swap bench-pending for needs-human-review
        id: act
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          test -s "$RUNNER_TEMP/out/table.md"
          python .github/inbound/apply_depeval.py --append-table "$RUNNER_TEMP/out/table.md" --pr "$PR" --repo "$REPO" --apply
          gh pr edit "$PR" -R "$REPO" --add-label "agent:needs-human-review" --remove-label "agent:bench-pending"
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: audit record
        if: always()
        env:
          DONE: ${{ steps.act.outputs.done }}
        run: |
          if [ "$DONE" = "true" ]; then OUTCOME=acted; DECISION="table appended; agent:needs-human-review"; else OUTCOME=failed; DECISION="bench table missing or the write failed"; fi
          python .github/inbound/ledger.py write "$RUNNER_TEMP/audit/record.json" \
            --field job=inbound-bench-full --field item="$PR" --field outcome="$OUTCOME" --field decision="$DECISION" \
            --field kill_switch_state=true --field model=null --field prompt_file=null --field prompt_version=null --field prompt_sha256=null \
            --field 'classification={"category":"dependency","confidence":"high","evidence":["grammar-or-parser"]}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: inbound-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/audit/
          retention-days: 90
