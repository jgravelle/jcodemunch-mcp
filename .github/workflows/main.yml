# Merge to main (docs/cicd/DESIGN.md section 2; CLAUDE.md "The Standard and the Harness").
#
# Purpose:  after a merge, run the harness once more as the witness that
#           merged-green equals branch-green, run the ONLINE bench tier (the
#           token benchmark included), record the results, and turn any Floor
#           violation on main into an issue nobody can miss.
# Trigger:  push to main.
# Blocks:   nothing (main is already merged); it OPENS ISSUES labeled
#           `regression`, one per failing threshold, deduplicated by title.
# Weekly:   on Mondays the results land as a PR from harness-bot/results-<date>
#           that goes through the PR gate like everything else. A bot push to
#           main cannot satisfy required checks (AUDIT section 7.1).
# Rules:    thresholds never live here; every gate is `python -m harness`;
#           actions SHA-pinned; no continue-on-error on a gating step.
name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false

env:
  UV_VERSION: "0.9.5"

jobs:
  full:
    name: "main: harness full (ubuntu, 3.12)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --extra watch
      - name: Full tier (witness that merged-green equals branch-green)
        id: full
        run: uv run python -m harness full --summary "${RUNNER_TEMP}/summary.md" --annotate
      - name: Publish the summary
        if: always()
        run: cat "${RUNNER_TEMP}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open a regression issue per failing Floor
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/open_regression_issue.py --summary "${RUNNER_TEMP}/summary.md" --label regression --range "${{ github.event.before }}..${{ github.sha }}"

  bench:
    name: "main: harness bench (online)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --extra watch
      - name: Corpus pins (cache key = tasks.json + the three SHAs)
        id: pins
        shell: bash
        run: |
          uv run python - > "${RUNNER_TEMP}/pins.txt" <<'PY'
          import json, pathlib
          for r in json.loads(pathlib.Path("benchmarks/tasks.json").read_text(encoding="utf-8"))["repos"]:
              print(r["id"], r["sha"])
          PY
          echo "key=bench-corpus-$(sha256sum benchmarks/tasks.json | cut -c1-12)-$(tr -d '\n ' < "${RUNNER_TEMP}/pins.txt" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        id: corpus-cache
        with:
          path: ${{ runner.temp }}/bench-corpus
          key: ${{ steps.pins.outputs.key }}
      - name: Clone the pinned corpora (LF)
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bench-corpus"
          while read -r repo sha; do
            dir="${RUNNER_TEMP}/bench-corpus/${repo//\//__}"
            git -c core.autocrlf=false clone --quiet --filter=blob:none --no-checkout "https://github.com/${repo}.git" "$dir"
            git -C "$dir" checkout --quiet "$sha"
          done < "${RUNNER_TEMP}/pins.txt"
      - name: Index the corpora into a fresh store
        env:
          CODE_INDEX_PATH: ${{ runner.temp }}/bench-index
        shell: bash
        run: |
          set -euo pipefail
          for dir in "${RUNNER_TEMP}"/bench-corpus/*/; do
            uv run python -c "
          import sys
          from jcodemunch_mcp import config; config.load_config()
          from jcodemunch_mcp.tools.index_folder import index_folder
          r = index_folder(sys.argv[1], use_ai_summaries=False, incremental=False, identity_mode='git')
          print(sys.argv[1], '->', r.get('repo'), r.get('file_count'), r.get('error') or '')
          " "$dir"
          done
      - name: Bench tier, ONLINE (offline steps plus the token benchmark on the pinned corpora)
        id: bench
        env:
          CODE_INDEX_PATH: ${{ runner.temp }}/bench-index
        run: uv run python -m harness bench --write-results --summary "${RUNNER_TEMP}/summary.md" --annotate
      - name: Publish the summary
        if: always()
        run: cat "${RUNNER_TEMP}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: harness-main-${{ github.sha }}
          path: |
            harness/results/latest.json
            harness/results/self_latency.json
          retention-days: 90
      - name: Open a regression issue per failing Floor
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/open_regression_issue.py --summary "${RUNNER_TEMP}/summary.md" --label regression --range "${{ github.event.before }}..${{ github.sha }}"

  weekly-results-pr:
    name: "main: results PR (weekly, Mondays)"
    needs: [bench]
    if: always() && needs.bench.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Only on Mondays (UTC), so the weekly record lands once
        id: day
        run: echo "monday=$([ "$(date -u +%u)" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        if: steps.day.outputs.monday == 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: steps.day.outputs.monday == 'true'
        with:
          name: harness-main-${{ github.sha }}
          path: harness/results/
      - name: Open the results PR (goes through the PR gate; a bot push to main cannot)
        if: steps.day.outputs.monday == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          D=$(date -u +%Y-%m-%d)
          # Once per date. Merging this PR on a Monday is itself a push to main on a
          # Monday, so without this the merge opened a second PR for the same date
          # (#684 -> #688) and every later Monday merge failed at `git push` of the
          # existing branch. The branch is deleted on merge, so the PR query (any
          # state) is what sees a merged week; ls-remote covers a branch with no PR.
          B="harness-bot/results-$D"
          N=$(gh pr list --state all --head "$B" --json number --jq length)
          if [ "$N" != 0 ]; then echo "a results PR for $D already exists; no PR"; exit 0; fi
          if git ls-remote --exit-code --heads origin "$B" >/dev/null; then echo "branch $B exists with no PR; no PR"; exit 0; fi
          # C-17: a made-up noreply address resolves to whichever GitHub account owns
          # that login (`harness-bot` is a stranger's, created 2026-05-18), so the
          # commit was attributed to them and CLA Assistant saw an unsigned author.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "harness-bot/results-$D"
          git add harness/results/latest.json harness/results/self_latency.json
          if git diff --cached --quiet; then echo "results unchanged; no PR"; exit 0; fi
          git commit -m "harness: weekly bench result ($D)"
          git push -u origin "harness-bot/results-$D"
          gh pr create --base main --head "harness-bot/results-$D" --title "harness: weekly bench result ($D)" \
            --label harness-results --label no-changelog \
            --body "Weekly harness results from run ${{ github.run_id }} on ${{ github.sha }}. Opened by main.yml; numbers computed in that run. Merge when green."
