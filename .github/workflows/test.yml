name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-trigger. During the 2026-08-06 Actions major outage the dispatch
  # for a push to main was DROPPED, not deferred: Dependency Graph ran, Tests
  # and Replay never appeared, and recovery does not retroactively create runs
  # for a push GitHub already discarded. With only push/pull_request triggers
  # the sole remedy was a junk commit or a throwaway PR to re-provoke the event.
  #
  # `gh workflow run test.yml --ref <branch>` re-runs the matrix against any ref
  # without touching history. Deliberately no inputs: this exists to re-run the
  # suite exactly as a push would, so an input that changed what ran would
  # defeat the point.
  workflow_dispatch:

jobs:
  test:
    strategy:
      # One leg dying must not cancel the other seven. On 2026-08-06 a Sigstore
      # 503 coincided with a platform-side cancellation and every matrix leg
      # went red within the same second; only ubuntu/3.10 had finished, and it
      # had PASSED. Nothing in the matrix reported a failing test, but the run
      # read as a total collapse and cost a full diagnosis to rule out.
      #
      # The cost of fail-fast here is inverted: these legs are the ONLY place
      # cross-platform and cross-version breakage surfaces, so cancelling the
      # survivors discards exactly the evidence needed to tell a real regression
      # from one flaky runner. A Windows-only failure should show as one red leg
      # next to seven green, not as eight reds.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          # Pin uv to skip the version-manifest fetch from
          # raw.githubusercontent.com that intermittently fails and takes
          # down the whole matrix (see run 25292200582).
          #
          # The pin must be able to READ uv.lock, which is `revision = 3`.
          # uv 0.6.5 could not, and did NOT error: it silently re-resolved, so
          # `uv sync` resolved fresh on every job and the committed lock pinned
          # nothing here. Bump this and re-lock together, never one alone.
          #
          # ⚠⚠ The same hazard runs the other way and that direction is
          # INVISIBLE. A *local* uv older than this pin does not fail on a
          # revision-3 lock either — it rewrites the file back to `revision = 1`
          # on any `uv lock`, stripping ~2,000 `upload-time` entries with it.
          # Nothing goes red, because the pinned CI uv reads both formats. So
          # the lock silently stops being the thing CI validated.
          #
          # This has now happened twice. 836fb28 restored the format once; it
          # regressed again and sat at `revision = 1` for 20+ commits until
          # PR #410 restored it on 2026-08-03. Neither regression turned CI red.
          #
          # => Contributors need a LOCAL uv >= this pin. Check `uv --version`
          #    before running `uv lock`, and check `head -2 uv.lock` after.
          #
          # ⚠ THIRD direction, found on the 1.108.247 bump: a local uv NEWER
          # than this pin keeps `revision = 3` — so `head -2` looks fine — but
          # its resolver rewrites unrelated content. uv 0.12.1 stripped the
          # `sys_platform` conjuncts off 53 nvidia markers (`(aarch64 and linux)
          # or (x86_64 and linux) or (AMD64 and win32)` -> `aarch64 or x86_64`),
          # widening them, on a run whose only intent was a version bump.
          # => Never `uv lock` to change the project version. Edit the one
          #    `name = "jcodemunch-mcp"` version line and check `git diff --stat
          #    uv.lock` reads 1 insertion, 1 deletion.
          version: "0.9.5"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev --extra watch

      - name: Run tests
        # `-n 4 --dist loadfile` — parallel across processes, whole file per
        # worker. Measured 2026-08-16 on a 24-core box: 599s serial vs 183s
        # parallel, both collecting 7859.
        #
        # ⚠⚠ `--dist loadfile` is load-bearing. The default `--dist load` spreads
        # individual tests across workers and breaks any file whose tests share
        # module-level state. Keeping a file whole preserves within-file order,
        # which is the only ordering guarantee the serial run actually gave us.
        #
        # ⚠ Pinned to 4, NOT `-n auto`. GitHub's standard runners are 4-core, so
        # `auto` resolves to 4 today and would silently jump if GitHub resizes
        # them. More workers is not free here: tests that do not isolate their
        # storage contend on the same `~/.code-index` process-lock scopes, and
        # that contention is the documented cause of the 47-minute outlier on
        # the 1.108.261 run. Raise this only with a measurement attached.
        #
        # ⚠ `-v` is deliberately dropped: under xdist it interleaves output from
        # 4 workers, which is less readable than the default progress line, not
        # more. `--tb=short` still gives full tracebacks on failure.
        run: uv run pytest tests/ -n 4 --dist loadfile --tb=short --cov=src --cov-report=term-missing --cov-fail-under=74

      - name: Verify sdist contains no sensitive paths
        if: runner.os == 'Linux'
        run: |
          uv build --sdist
          SDIST=$(ls dist/*.tar.gz | head -1)
          echo "Checking $SDIST for sensitive paths..."
          # Match common credential FILE shapes only, not any path that happens
          # to contain the substring "credentials" (e.g., our legitimate source
          # module src/jcodemunch_mcp/credentials.py and tests/test_credentials.py).
          FOUND=$(tar -tzf "$SDIST" | grep -E '(/\.claude/|/\.env(\.|$)|/\.pypirc|/\.aws/|/\.ssh/|/id_rsa|/id_ed25519|\.pem$|\.key$|/credentials\.(json|yaml|yml|conf|cfg|ini|env)$|/aws_?credentials$|/google[-_]credentials)' || true)
          if [ -n "$FOUND" ]; then
            echo "ERROR: Sensitive paths found in sdist:"
            echo "$FOUND"
            exit 1
          fi
          echo "OK: No sensitive paths found in sdist."

  lint:
    # Platform-independent, so run once rather than across the test matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          # Keep identical to the test job's pin; see the note there.
          version: "0.9.5"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff lint (src/)
        # Rule selection + grandfathered ignores live in [tool.ruff.lint] in
        # pyproject.toml. Keep the gate green: fix the finding, or justify a new
        # ignore in the same PR.
        run: uv run ruff check src/
