# purpose:  the monthly competitive run (docs/competitive/DESIGN.md s9.1):
#           every adapter over the pinned corpus set, three repetitions, in
#           the D2 container; scored, findings drafted, the result and the
#           drafts pushed to the ledger branch by the App; nothing posted
# invokes:  killswitch.py, budget.py (row competitive-run), run.py (the
#           corpus and task checks run inside it, before scoring),
#           findings.py, ledger.py; docker on the runner; git on the ledger
#           checkout with the App token
# produces: competitive/results/<date>-<commit>.json + latest.md on
#           inbound-ledger; competitive/drafts/*.md there (approved: false);
#           artifacts competitive-result-<run> and competitive-audit-<run>
# refuses:  to run when INBOUND_ENABLED is not "true" or the day's budget
#           is spent; to write anything to any branch but inbound-ledger;
#           to run a model; to touch the never-touch list (POLICY 4.4 plus
#           DESIGN s9.3's additions: harness/thresholds.json,
#           harness/corpora.json, benchmarks/tasks.json, docs/standard/**,
#           README.md, benchmarks/results.md, benchmarks/jcm_reference.json)
name: competitive run

on:
  schedule:
    - cron: "0 3 * * 0"   # every Sunday 03:00 UTC; the first job step keeps only the FIRST Sunday (cron cannot say "first")
  workflow_dispatch:
    inputs:
      reason:
        description: "why this run (release:<tool>@<version>, manual, ...)"
        required: true
        default: manual
      tool:
        description: "one adapter name to run instead of all (empty = all)"
        required: false
        default: ""

# GITHUB_TOKEN is read-only here: every write goes through the App token,
# which the ruleset confines to inbound-ledger.
permissions:
  contents: read
  actions: read

concurrency:
  group: competitive-run
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.gate.outputs.go }}
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: the first Sunday only (a dispatch always passes)
        id: day
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%d)" -gt 7 ]; then echo "first=false" >> "$GITHUB_OUTPUT"; else echo "first=true" >> "$GITHUB_OUTPUT"; fi
      - name: switch-reading token (App; the only token that can read a repository variable, VERIFICATION 7.1)
        if: steps.day.outputs.first == 'true'
        id: switchtok
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.INBOUND_APP_ID }}
          private-key: ${{ secrets.INBOUND_APP_PRIVATE_KEY }}
      - name: kill switch and budget
        id: gate
        env:
          FIRST: ${{ steps.day.outputs.first }}
          SWITCH_TOKEN: ${{ steps.switchtok.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$FIRST" != "true" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          GH_TOKEN="$SWITCH_TOKEN" python .github/inbound/killswitch.py --repo "$REPO" --job competitive-run --record "$RUNNER_TEMP/audit/record.json"; k=$?
          python .github/inbound/budget.py --job competitive-run --repo "$REPO"; b=$?
          set -e
          if [ "$k" != "0" ] || [ "$b" != "0" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: competitive-audit-${{ github.run_id }}-gate
          path: ${{ runner.temp }}/audit/
          retention-days: 90
          if-no-files-found: ignore

  run:
    # Holds no App token and no secret: the competitor images run here
    # (DESIGN s9.3). It starts only from the gate's `go` and writes nothing.
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      TOOL: ${{ github.event.inputs.tool }}
      REASON: ${{ github.event.inputs.reason || 'schedule' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: dependencies and the tokenizer asset
        run: |
          uv sync --locked --group dev --extra watch
          uv run python -m harness warm
      - name: every adapter over the pinned set, three runs, in the container (the corpus and task checks refuse before scoring)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          ADAPTERS="null_readall,null_grep,jcodemunch,cymbal,codebase_memory,code_review_graph,serena,codegraph,graft,aider,cocoindex"
          if [ -n "$TOOL" ]; then ADAPTERS="null_readall,null_grep,jcodemunch,$TOOL"; fi
          uv run python benchmarks/competitive/run.py --runs 3 --adapters "$ADAPTERS" --sandbox docker --out-dir "$RUNNER_TEMP/out"
          echo "$REASON" > "$RUNNER_TEMP/out/reason.txt"
      - name: findings to drafts (nothing posted; the tracker read is the only network step here)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RES=$(ls "$RUNNER_TEMP"/out/2*.json | head -1)
          uv run python benchmarks/competitive/findings.py "$RES" --history benchmarks/competitive/results/history.jsonl --out "$RUNNER_TEMP/out/drafts"
      - name: prune the images (DESIGN s9.2)
        if: always()
        run: docker system prune -af --volumes >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: competitive-result-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 90
          if-no-files-found: ignore

  ledger:
    # The write job: no competitor code, no model; the App token for the
    # ledger push only, after a second read of the switch. `gate` is in
    # needs because the needs context carries direct dependencies only.
    needs: [gate, run]
    if: always() && needs.gate.outputs.go == 'true' && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPO: ${{ github.repository }}
      APP_LOGIN: jcodemunch-inbound[bot]
      RUN_RESULT: ${{ needs.run.result }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v5
        with:
          name: competitive-result-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
      - name: switch-reading token (App; the only token that can read a repository variable, VERIFICATION 7.1)
        id: switchtok
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.INBOUND_APP_ID }}
          private-key: ${{ secrets.INBOUND_APP_PRIVATE_KEY }}
      - name: re-read the kill switch before the write
        env:
          SWITCH_TOKEN: ${{ steps.switchtok.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: GH_TOKEN="$SWITCH_TOKEN" python .github/inbound/killswitch.py --repo "$REPO" --job competitive-run --record "$RUNNER_TEMP/audit/record.json"
      - name: App token (DESIGN D2; this job only)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.INBOUND_APP_ID }}
          private-key: ${{ secrets.INBOUND_APP_PRIVATE_KEY }}
      - name: check out the ledger branch beside the tree
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: inbound-ledger
          path: ledger-branch
          token: ${{ steps.app.outputs.token }}
          persist-credentials: true
          fetch-depth: 0
      - name: copy the result, the summary and the drafts into competitive/ on the ledger (a draft already there is never overwritten)
        id: copy
        run: |
          mkdir -p ledger-branch/competitive/results ledger-branch/competitive/drafts
          cp "$RUNNER_TEMP"/out/2*.json ledger-branch/competitive/results/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/out/latest.md ledger-branch/competitive/results/latest.md 2>/dev/null || true
          n=0
          for f in "$RUNNER_TEMP"/out/drafts/*.md; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            if [ -f "ledger-branch/competitive/drafts/$b" ]; then
              # an existing draft keeps its head (a human's approved: true) and gains this run's dated block
              awk 'f{print} /^## /{f=1; print}' "$f" | sed '1d' >> "ledger-branch/competitive/drafts/$b"
            else
              cp "$f" "ledger-branch/competitive/drafts/$b"
            fi
            n=$((n+1))
          done
          echo "drafts=$n" >> "$GITHUB_OUTPUT"
      - name: commit the ledger (the only push; the ruleset confines the App to this branch)
        id: push
        run: |
          cd ledger-branch
          git config user.name "$APP_LOGIN"
          git config user.email "inbound@users.noreply.github.com"
          git add -A competitive/
          git diff --cached --quiet || git commit -q -m "competitive run: $(date -u +%Y-%m-%d) ($(cat "$RUNNER_TEMP/out/reason.txt" 2>/dev/null || echo unknown))"
          git push origin HEAD:inbound-ledger
          echo "done=true" >> "$GITHUB_OUTPUT"
      - name: audit record
        if: always()
        env:
          DONE: ${{ steps.push.outputs.done }}
          DRAFTS: ${{ steps.copy.outputs.drafts }}
        run: |
          if [ -f "$RUNNER_TEMP/audit/record.json" ]; then exit 0; fi
          if [ "$DONE" = "true" ] && [ "$RUN_RESULT" = "success" ]; then OUTCOME=drafted; DECISION="result and $DRAFTS draft(s) on the ledger; nothing posted"; else OUTCOME=failed; DECISION="run $RUN_RESULT; ledger push ${DONE:-false}"; fi
          python .github/inbound/ledger.py write "$RUNNER_TEMP/audit/record.json" \
            --field job=competitive-run --field item="$(cat "$RUNNER_TEMP/out/reason.txt" 2>/dev/null || echo unknown)" --field outcome="$OUTCOME" --field decision="$DECISION" \
            --field kill_switch_state=true --field model=null --field prompt_file=null --field prompt_version=null --field prompt_sha256=null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: competitive-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/audit/
          retention-days: 90
