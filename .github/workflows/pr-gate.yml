# PR gate (docs/cicd/DESIGN.md section 1; CLAUDE.md "The Standard and the Harness").
#
# Purpose:  run the harness's judgment on every pull request, cheapest stage
#           first, and block the merge on any Floor violation.
# Trigger:  pull_request to main (draft PRs run stage 1 only).
# Blocks:   every job here is a required status check on main, by name.
#           A rename is a branch-protection change, not a cosmetic one.
# Rules:    no threshold lives in this file -- every gate is `python -m harness`
#           or a script that reads harness/thresholds.json; every action is
#           pinned to a commit SHA; no continue-on-error on a gating step.
#
# Stage 1 (fast fail): harness fast tier, format, types ratchet, dependency
#           audit, secret scan.                                     ~2 min
# Stage 2 (correctness): harness full tier on 2 OS x 4 Python.    ~12 min wall
# Stage 3 (packaging): build wheel+sdist, install into a clean venv, real stdio
#           handshake, index a fixture repo, two tool calls.       ~3 min/OS
# Stage 4 (benchmark gate): bench tier offline + token benchmark on cached
#           pinned corpora; one PR comment with base vs PR.         ~3 min
# Stage 5 (definition of done): changelog line, version pins, tool surface
#           documented.                                              ~1 min
name: PR gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.5"   # must be able to read uv.lock revision 3; bump with the lock, never alone

jobs:
  # ------------------------------------------------------------- stage 1
  fast-harness:
    name: "fast: harness fast tier"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --extra watch
      - name: Fast tier (85 offline files, ruff, every offline Floor)
        run: uv run python -m harness fast --summary "$GITHUB_STEP_SUMMARY" --annotate

  fast-format:
    name: "fast: format"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: ruff format --check (harness/, scripts/; src/ is 254 files unformatted, docs/cicd/FINDINGS.md C-1)
        run: |
          uvx ruff@0.13.0 format --check harness/ scripts/ 2>&1 | tee /tmp/fmt.log
          rc=${PIPESTATUS[0]}
          { echo "## format: $([ $rc = 0 ] && echo PASS || echo FAIL)"; echo; echo '```'; tail -20 /tmp/fmt.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  fast-types:
    name: "fast: types"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --extra watch
      - name: pyright error count ratchet (Floor types.error_max)
        run: uv run python -m harness check types.error_max --summary "$GITHUB_STEP_SUMMARY" --annotate

  fast-deps:
    name: "fast: dependency audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: pip-audit over the runtime dependency set (Floor deps.vuln_max)
        run: uv run --no-dev python -m harness check deps.vuln_max --summary "$GITHUB_STEP_SUMMARY" --annotate

  fast-secrets:
    name: "fast: secret scan"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
      - name: gitleaks over the PR's commits
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ------------------------------------------------------------- stage 2
  full:
    name: "full: test (${{ matrix.os }}, ${{ matrix.python-version }})"
    needs: [fast-harness, fast-format, fast-types, fast-deps, fast-secrets]
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20   # ci.test_job_timeout_minutes; the harness asserts this literal against the Floor
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --group dev --extra watch --python ${{ matrix.python-version }}
      - name: Full tier (all of tests/, coverage Floor, skip ceiling, wall ceiling)
        shell: bash
        run: uv run --python ${{ matrix.python-version }} python -m harness full --summary "$GITHUB_STEP_SUMMARY" --annotate
      - name: Verify sdist contains no sensitive paths (the v0.2.6 credential-leak guard)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          uv build --sdist
          if tar -tzf dist/*.tar.gz | grep -E '(^|/)\.(claude|env|git|pypirc)(/|$)|settings\.local\.json|\.pypirc|suite\.log|relnotes\.md'; then
            echo "::error title=sdist::sensitive paths found in the sdist"; exit 1
          fi
          echo "sdist clean" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------- stage 3
  package:
    name: "package: install and handshake (${{ matrix.os }})"
    needs: [full]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        shell: bash
        run: uv build && ls -l dist/
      - name: Install the WHEEL into a clean venv and probe it over stdio
        shell: bash
        run: |
          set -euo pipefail
          V=$(python -c "import re;print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          uv venv "${RUNNER_TEMP}/pkg" --python 3.12
          if [ "${{ runner.os }}" = "Windows" ]; then B="${RUNNER_TEMP}/pkg/Scripts"; EXE="$B/jcodemunch-mcp.exe"; else B="${RUNNER_TEMP}/pkg/bin"; EXE="$B/jcodemunch-mcp"; fi
          uv pip install --python "$B/python" dist/*.whl
          "$B/python" -c "import jcodemunch_mcp, sys; print('import ok', jcodemunch_mcp.__file__)"
          "$EXE" surface | head -5
          "$B/python" scripts/handshake.py --expect-version "$V" --command "$EXE" \
            --fixture tests/fixtures/pkg_smoke --expect-languages python,typescript,javascript,go 2>&1 | tee "${RUNNER_TEMP}/handshake.log"
          { echo "## package (wheel, ${{ matrix.os }})"; echo; echo '```'; grep -E "HANDSHAKE|FAIL|tool_count|first_hit" "${RUNNER_TEMP}/handshake.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Install the SDIST into a second clean venv and probe it (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          V=$(python -c "import re;print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          uv venv "${RUNNER_TEMP}/pkg-sdist" --python 3.12
          B="${RUNNER_TEMP}/pkg-sdist/bin"
          uv pip install --python "$B/python" dist/*.tar.gz
          "$B/python" scripts/handshake.py --expect-version "$V" --command "$B/jcodemunch-mcp" \
            --fixture tests/fixtures/pkg_smoke --expect-languages python,typescript,javascript,go 2>&1 | tail -3 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: dist-${{ github.event.pull_request.head.sha }}
          path: dist/
          retention-days: 7

  # ------------------------------------------------------------- stage 4
  bench:
    name: "bench: harness bench tier"
    needs: [full]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --extra watch
      - name: Bench tier, offline (replay, route recall, schema, self-latency)
        run: uv run python -m harness bench --offline --write-results --summary "$GITHUB_STEP_SUMMARY" --annotate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: harness-bench-${{ github.event.pull_request.head.sha }}
          path: |
            harness/results/latest.json
            harness/results/self_latency.json
          retention-days: 30

  bench-tokens:
    name: "bench: token benchmark"
    needs: [full]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - name: Corpus pins (cache key = tasks.json + the three SHAs; a pin names an immutable tree)
        id: pins
        shell: bash
        run: |
          uv run python - > "${RUNNER_TEMP}/pins.txt" <<'PY'
          import json, pathlib
          for r in json.loads(pathlib.Path("benchmarks/tasks.json").read_text(encoding="utf-8"))["repos"]:
              print(r["id"], r["sha"])
          PY
          echo "key=bench-corpus-$(sha256sum benchmarks/tasks.json | cut -c1-12)-$(tr -d '\n ' < "${RUNNER_TEMP}/pins.txt" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        id: corpus-cache
        with:
          path: ${{ runner.temp }}/bench-corpus
          key: ${{ steps.pins.outputs.key }}
      - name: Clone the pinned corpora (LF; harness F-13)
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bench-corpus"
          while read -r repo sha; do
            dir="${RUNNER_TEMP}/bench-corpus/${repo//\//__}"
            git -c core.autocrlf=false clone --quiet --filter=blob:none --no-checkout "https://github.com/${repo}.git" "$dir"
            git -C "$dir" checkout --quiet "$sha"
            echo "${repo} @ $(git -C "$dir" rev-parse HEAD)"
          done < "${RUNNER_TEMP}/pins.txt"
      - name: Index the corpora into a fresh store
        env:
          CODE_INDEX_PATH: ${{ runner.temp }}/bench-index
        shell: bash
        run: |
          set -euo pipefail
          for dir in "${RUNNER_TEMP}"/bench-corpus/*/; do
            uv run python -c "
          import sys
          from jcodemunch_mcp import config; config.load_config()
          from jcodemunch_mcp.tools.index_folder import index_folder
          r = index_folder(sys.argv[1], use_ai_summaries=False, incremental=False, identity_mode='git')
          print(sys.argv[1], '->', r.get('repo'), r.get('file_count'), r.get('error') or '')
          " "$dir"
          done
      - name: Token benchmark with the Floors (token.grand_ratio_vs_grep, token.per_repo_rise_max)
        env:
          CODE_INDEX_PATH: ${{ runner.temp }}/bench-index
        shell: bash
        run: |
          set -o pipefail
          uv run python benchmarks/harness/run_benchmark.py --verify-determinism --floor \
            --json "${RUNNER_TEMP}/benchmark.json" --out "${RUNNER_TEMP}/benchmark.md" 2>&1 | tee "${RUNNER_TEMP}/bench.log"
          rc=$?
          { echo "## bench: token benchmark: $([ $rc = 0 ] && echo PASS || echo FAIL)"; echo; echo '```'; grep -E "crit|FAIL|PASS|identical" "${RUNNER_TEMP}/bench.log" | tail -8; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Post the delta against the base as one PR comment (same-repo PRs; forks get the summary only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          POST=""
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then POST="--post"; fi
          uv run python scripts/pr_bench_comment.py --base-ref "origin/${{ github.base_ref }}" \
            --results harness/results/latest.json --benchmark "${RUNNER_TEMP}/benchmark.json" \
            --pr ${{ github.event.pull_request.number }} --summary "$GITHUB_STEP_SUMMARY" $POST || echo "::warning::bench comment not posted (see summary)"

  # ------------------------------------------------------------- stage 5
  done-changelog:
    name: "done: changelog"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
      - name: src/ changed => CHANGELOG grew, or the PR is labeled no-changelog (Definition of Done 3)
        shell: bash
        run: |
          python scripts/dod_changelog.py --base-ref "origin/${{ github.base_ref }}" \
            --labels "${{ join(github.event.pull_request.labels.*.name, ',') }}" --summary "$GITHUB_STEP_SUMMARY"

  done-pins:
    name: "done: version pins"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
      - name: Seven pin sites agree; a moved version has its CHANGELOG heading and whatsnew entry (Definition of Done 1-2)
        shell: bash
        run: |
          python scripts/release_preflight.py --pins-only --base-ref "origin/${{ github.base_ref }}" \
            --labels "${{ join(github.event.pull_request.labels.*.name, ',') }}" --summary "$GITHUB_STEP_SUMMARY"

  done-surface:
    name: "done: tool surface documented"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - name: Tool listing on base vs head; a diff needs README, CLAUDE.md and CHANGELOG (Practice 1)
        shell: bash
        run: uv run python scripts/surface_diff.py --base-ref "origin/${{ github.base_ref }}" --summary "$GITHUB_STEP_SUMMARY"
