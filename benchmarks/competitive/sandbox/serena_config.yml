# Serena 1.7.0 global configuration for the competitive sandbox
# (docs/competitive/fairness/serena.md, "Global configuration"). Every value
# is the template's (src/serena/resources/serena_config.template.yml at
# v1.7.0) except the four the note names: no dashboard, no GUI log window,
# the language server launched from the image instead of through uvx, and
# the per-project folder outside the read-only corpus.
language_backend: LSP
line_ending: native
gui_log_window: False
web_dashboard: False
web_dashboard_open_on_launch: False
web_dashboard_interface:
web_dashboard_listen_address: 127.0.0.1
web_dashboard_trusted_hosts:
  - 127.0.0.1
  - localhost
jetbrains_plugin_server_address: 127.0.0.1
jetbrains_launch_command:
log_level: 20
trace_lsp_communication: False
ls_specific_settings:
  python:
    ls_path: /usr/local/bin/pyright-langserver
ls_priorities:
ignored_paths: []
read_only_memory_patterns: []
ignored_memory_patterns: []
tool_timeout: 240
excluded_tools: []
included_optional_tools: []
fixed_tools: []
base_modes:
  - interactive
  - editing
default_modes:
default_max_tool_answer_chars: 150000
token_count_estimator: CHAR_COUNT
symbol_info_budget: 10
project_serena_folder_location: "/out/serena-projects/$projectFolderName/.serena"
trusted_project_path_patterns: []
projects: []
